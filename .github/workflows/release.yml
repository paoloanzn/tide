# Builds Tide for each supported platform and publishes the official GitHub
# release.
#
# Pushing a tag vX.Y.Z (or vX.Y.Z-suffix, published as a pre-release) builds,
# tests and packages every platform, runs CI on the tagged commit, then creates
# the GitHub release for the tag with the archives attached. The tag must match
# project(VERSION) in CMakeLists.txt.
#
# Running the workflow by hand from the Actions tab is a dry run: it builds
# and packages everything and keeps the archives as run artifacts, but
# publishes nothing.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - name: Match the tag against the project version
        id: version
        run: |
          version=$(sed -n 's/^project(tide VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          manifest=$(sed -n 's/.*"version-string": *"\([^"]*\)".*/\1/p' vcpkg.json)
          if [ -z "$version" ]; then
            echo "::error file=CMakeLists.txt::no project(tide VERSION ...) found"
            exit 1
          fi
          if [ "$version" != "$manifest" ]; then
            echo "::error file=vcpkg.json::version-string $manifest does not match CMakeLists.txt version $version"
            exit 1
          fi
          prerelease=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            case "$GITHUB_REF_NAME" in
              "v$version") ;;
              "v$version"-*) prerelease=true ;;
              *)
                echo "::error::tag $GITHUB_REF_NAME does not match the project version: expected v$version or v$version-<suffix>"
                exit 1
                ;;
            esac
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Tide $version (ref: $GITHUB_REF_NAME, pre-release: $prerelease)"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build (${{ matrix.target }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu so the binary runs on glibc
          # 2.35 and newer; the C++ runtime is linked in statically.
          - target: linux-x86_64
            os: ubuntu-22.04
            cc: gcc-12
            cxx: g++-12
            ldflags: -static-libstdc++ -static-libgcc
          - target: linux-arm64
            os: ubuntu-22.04-arm
            cc: gcc-12
            cxx: g++-12
            ldflags: -static-libstdc++ -static-libgcc
          - target: macos-arm64
            os: macos-15
            cc: clang
            cxx: clang++
            ldflags: ''
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      # Oldest macOS the binary and its vcpkg dependencies run on.
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-12 ninja-build autoconf autoconf-archive automake libtool pkg-config
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: brew install ninja autoconf autoconf-archive automake libtool pkgconf
      - name: Set up vcpkg at the manifest baseline
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)
          root="$RUNNER_TEMP/vcpkg"
          git -c init.defaultBranch=main init -q "$root"
          git -C "$root" fetch -q --depth 1 https://github.com/microsoft/vcpkg.git "$baseline"
          git -C "$root" checkout -q FETCH_HEAD
          "$root/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          # The deployment target is not part of vcpkg's package hashes, so it
          # goes into the key along with the runner image version.
          prefix="vcpkg-release-${{ matrix.target }}-${{ hashFiles('vcpkg.json') }}-$MACOSX_DEPLOYMENT_TARGET-"
          {
            echo "VCPKG_ROOT=$root"
            echo "VCPKG_BINARY_SOURCES=clear;files,$RUNNER_TEMP/vcpkg-cache,readwrite"
            echo "VCPKG_KEEP_ENV_VARS=MACOSX_DEPLOYMENT_TARGET"
            echo "VCPKG_CACHE_PREFIX=$prefix"
            echo "VCPKG_CACHE_KEY=$prefix${ImageVersion:-none}"
          } >> "$GITHUB_ENV"
      - name: Restore vcpkg packages
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ env.VCPKG_CACHE_KEY }}
          restore-keys: ${{ env.VCPKG_CACHE_PREFIX }}
      - name: Configure
        run: cmake --preset release "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.ldflags }}"
      - name: Save vcpkg packages
        if: steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: ${{ env.VCPKG_CACHE_KEY }}
      - name: Build
        run: cmake --build build/release
      - name: Test
        run: ctest --test-dir build/release --output-on-failure
      - name: Package
        env:
          COPYFILE_DISABLE: '1' # no macOS resource-fork entries in the archive
        run: |
          set -euo pipefail
          asset="tide-${{ matrix.target }}.tar.gz"
          stage=$(mktemp -d)
          cp build/release/tide README.md "$stage/"
          strip "$stage/tide"
          test "$("$stage/tide" --version)" = "tide $VERSION"
          "$stage/tide" check tests/examples/07_e2e_tokens.tid
          mkdir -p dist
          tar -C "$stage" -czf "dist/$asset" tide README.md
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          cat "dist/$asset.sha256"
      - name: Inspect the binary (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          tar -xzf dist/tide-*.tar.gz -C "$RUNNER_TEMP" tide
          ldd "$RUNNER_TEMP/tide"
          if ldd "$RUNNER_TEMP/tide" | grep -E 'libstdc\+\+|libgcc_s'; then
            echo "::error::the C++ runtime is linked dynamically"
            exit 1
          fi
          echo "needs glibc $(objdump -T "$RUNNER_TEMP/tide" | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1)"
      - name: Inspect the binary (macOS)
        if: runner.os == 'macOS'
        run: |
          tar -xzf dist/tide-*.tar.gz -C "$RUNNER_TEMP" tide
          otool -L "$RUNNER_TEMP/tide"
          vtool -show-build "$RUNNER_TEMP/tide"
      - uses: actions/upload-artifact@v7
        with:
          name: tide-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [version, ci, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: tide-*
          merge-multiple: true
          path: dist
      - name: Create the release and attach the archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          cd dist
          cat tide-*.tar.gz.sha256 > checksums.txt
          ls -l
          # A re-run for a tag that already has a release refreshes its assets.
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber
          else
            flags=()
            if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
            gh release create "$TAG" ./* --verify-tag --title "Tide $VERSION" --generate-notes "${flags[@]}"
          fi
          echo "published: https://github.com/$GH_REPO/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
